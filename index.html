<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta id="theme-color" name="theme-color" content="#F8FAFC" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      id="apple-status-bar-style"
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: var(--initial-splash-background, #f8fafc);
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: var(--initial-splash-background, #f8fafc);
      }
      #initial-splash svg {
        width: 4.5rem;
        height: 4.5rem;
        display: block;
      }
      #initial-splash path {
        fill: var(--initial-splash-logo, #4f46e5);
      }
      html.dark #initial-splash path {
        fill: #a5b4fc;
      }
      #initial-splash[hidden] {
        display: none;
      }
    </style>
    <title>Nuvora</title>
  </head>
  <body>
    <div id="initial-splash" role="status" aria-label="Cargando Nuvora">
      <svg
        viewBox="0 0 512 512"
        width="72"
        height="72"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M152 368C143 368 136 361 136 352V160C136 151 143 144 152 144H177C184 144 190 147 194 153L312 296V160C312 151 319 144 328 144H360C369 144 376 151 376 160V352C376 361 369 368 360 368H335C328 368 322 365 318 359L200 216V352C200 361 193 368 184 368Z"
        />
      </svg>
    </div>
    <script src="/theme.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
